<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بەخێربێن بۆ Kurd24 Job</title>
  <!-- Google Fonts Vazirmatn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <meta name="theme-color" content="#00D4AA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kurd24">
  <link rel="apple-touch-icon" href="/assets/images/logo.png">

  <style>
    :root {
      --primary: #00D4AA;
      --primary-glow: rgba(0, 212, 170, 0.15);
      --accent: #FFB800;
      --background: #0A0A0F;
      --card-bg: rgba(18, 18, 28, 0.85);
      --card-border: rgba(255, 255, 255, 0.06);
      --text: #f8fafc;
      --text-secondary: #94a3b8;
      --border-radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background-image: 
      radial-gradient(at 0% 0%, rgba(0, 212, 170, 0.12) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(255, 184, 0, 0.1) 0px, transparent 50%);
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--border-radius);
      padding: 40px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .logo-container {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .logo-img {
      width: 85%;
      height: 85%;
      object-fit: contain;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff 30%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 35px;
      padding: 0 10px;
    }

    /* Pulse Button Installation */
    .pulse-btn {
      background: linear-gradient(135deg, #00D4AA 0%, #FFB800 100%);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 0 20px rgba(0, 212, 170, 0.4);
      transition: all 0.3s ease;
      animation: pulse 2s infinite;
      margin-bottom: 40px;
      outline: none;
      text-decoration: none;
    }

    .pulse-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(255, 184, 0, 0.6);
    }

    .pulse-btn:active {
      transform: translateY(0);
    }

    .pulse-btn i {
      width: 20px;
      height: 20px;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(0, 212, 170, 0.6);
      }
      70% {
        box-shadow: 0 0 0 15px rgba(0, 212, 170, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(0, 212, 170, 0);
      }
    }

    /* Guide Section */
    .guide-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
      text-align: right;
    }

    .guide-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: right;
    }

    .guide-step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: rgba(255, 255, 255, 0.02);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .step-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary-glow);
      color: var(--primary);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      font-weight: 700;
      font-size: 13px;
    }

    .step-text {
      font-size: 13px;
      line-height: 1.5;
    }

    .step-text strong {
      color: var(--primary);
    }

    .ios-tip {
      background: rgba(244, 114, 182, 0.08) !important;
      border-color: rgba(244, 114, 182, 0.1) !important;
    }

    .ios-tip .step-icon {
      background: rgba(244, 114, 182, 0.15);
      color: var(--accent);
    }

    .ios-tip .step-text strong {
      color: var(--accent);
    }

    .footer {
      margin-top: 30px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.2);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container">
    <!-- Beautiful Glass Navigation Bar -->
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px 20px; background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 50px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);">
      <div style="font-weight: 800; font-size: 14px; color: var(--primary); display: flex; align-items: center; gap: 6px;">
        <i data-lucide="briefcase" style="width: 16px; height: 16px; color: var(--primary);"></i>
        <span>Kurd24 Job</span>
      </div>
      <nav style="display: flex; gap: 12px; font-size: 11px; font-weight: 700;">
        <a href="#" onclick="showSection('download')" id="nav-download" style="color: var(--primary); text-decoration: none; padding: 4px 8px; border-radius: 20px; transition: all 0.2s;">گەڕان بەدوای کار</a>
        <a href="#" onclick="showSection('services')" id="nav-services" style="color: var(--text-secondary); text-decoration: none; padding: 4px 8px; border-radius: 20px; transition: all 0.2s;">خزمەتگوزاریەکان</a>
        <a href="#" onclick="showSection('about')" id="nav-about" style="color: var(--text-secondary); text-decoration: none; padding: 4px 8px; border-radius: 20px; transition: all 0.2s;">ئێمە</a>
      </nav>
    </header>

    <div class="glass-card" style="padding: 30px 24px;">
      
      <!-- SECTION 1: DOWNLOAD / SEARCH JOBS (Default) -->
      <div id="section-download" class="landing-section-content">
        <div class="logo-container">
          <img class="logo-img" src="/assets/images/logo.png" alt="Kurd24 Logo">
        </div>
        
        <h1 id="app-title">Kurd24 Job</h1>
        <p id="app-subtitle" class="subtitle" style="margin-bottom: 25px;">بارکردنی زانیارییەکان...</p>

        <!-- Dynamic Download/Redirect Button -->
        <button id="install-btn" class="pulse-btn" style="margin-bottom: 30px;">
          <i id="btn-icon" data-lucide="download-cloud"></i>
          <span id="btn-text">دابەزاندنی ئەپەکە</span>
        </button>

        <!-- Step Guides -->
        <div class="guide-title" id="guide-header">ڕێنمایی دابەزاندن و دامەزراندن</div>
        <div class="guide-list" id="steps-container">
          <!-- Will be populated dynamically based on download type -->
        </div>
      </div>

      <!-- SECTION 2: SERVICES (خزمەتگوزاریەکان) -->
      <div id="section-services" class="landing-section-content" style="display: none;">
        <div style="text-align: center; margin-bottom: 25px;">
          <div style="width: 56px; height: 56px; border-radius: 50%; background: var(--primary-glow); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;">
            <i data-lucide="cog" style="width: 24px; height: 24px;"></i>
          </div>
          <h2 style="font-size: 20px; font-weight: 800; color: #fff;">خزمەتگوزاریەکانی ئێمە</h2>
          <p style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">ئێمە چی پێشکەش دەکەین لە Kurd24 Job</p>
        </div>

        <div class="guide-list">
          <div class="guide-step">
            <div class="step-icon">١</div>
            <div class="step-text">
              <strong>گەڕان بەدوای هەلی کار:</strong> دۆزینەوەی خێرای نوێترین هەلی کار لە کەرتی گشتی و تایبەت لە سەرانسەری شارەکانی کوردستان.
            </div>
          </div>
          <div class="guide-step">
            <div class="step-icon">٢</div>
            <div class="step-text">
              <strong>بڵاوکردنەوەی هەلی کار:</strong> بەڕێوەبردن و بڵاوکردنەوەی هەلی کار بە شێوەیەکی خێرا و ئاسان لەلایەن خاوەنکارەکانەوە.
            </div>
          </div>
          <div class="guide-step">
            <div class="step-icon">٣</div>
            <div class="step-text">
              <strong>ڕیکلامی VIP درەوشاوە:</strong> نیشاندانی هەلی کارەکانت بە دیزاینێکی ئاڵتونی جوڵاو و هێشتنەوەی لە سەرەوەی لیستەکە بۆ زۆرترین بینین.
            </div>
          </div>
          <div class="guide-step">
            <div class="step-icon">٤</div>
            <div class="step-text">
              <strong>نۆتیفیکەیشنی دەستبەجێ:</strong> ئاگادارکردنەوەی بەکارهێنەران لەگەڵ بڵاوکردنەوەی هەر هەلی کارێکی نوێ بۆ ئەوەی هیچ دەرفەتێک لەدەست نەدەیت.
            </div>
          </div>
        </div>
      </div>

      <!-- SECTION 3: ABOUT / CONTACT (ئێمە) -->
      <div id="section-about" class="landing-section-content" style="display: none;">
        <div style="text-align: center; margin-bottom: 25px;">
          <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(255, 184, 0, 0.1); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;">
            <i data-lucide="phone-call" style="width: 24px; height: 24px;"></i>
          </div>
          <h2 style="font-size: 20px; font-weight: 800; color: #fff;">پەیوەندیمان پێوە بکەن</h2>
          <p style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">بۆ بڵاوکردنەوەی ڕیکلامی ئاسایی و VIP</p>
        </div>

        <p style="font-size: 13px; text-align: center; line-height: 1.6; margin-bottom: 20px;">
          ئێمە لە Kurd24 Job پردی سەرەکین بۆ بەیەک گەیاندنی خاوەنکاران و کارخوازان. ئەگەر دەتەوێت کارەکەت بە خێراترین کات بڵاوببێتەوە و بگاتە زۆرترین کارخواز، یان گەر دەتەوێت کارەکەت بکەیتە <strong>VIP Ad</strong> بە دیزاینێکی ئاڵتونی، لە ڕێگەی دەستەبەرەکانی خوارەوە پەیوەندیمان پێوە بکەن:
        </p>

        <div class="guide-list">
          <div class="guide-step" style="cursor: pointer; background: rgba(37, 211, 102, 0.04); border-color: rgba(37, 211, 102, 0.1);" onclick="window.open('https://wa.me/9647501234567')">
            <div class="step-icon" style="background: rgba(37, 211, 102, 0.15); color: #25D366;">
              <i data-lucide="phone" style="width: 14px; height: 14px;"></i>
            </div>
            <div class="step-text">
              پەیوەندی لە ڕێگەی <strong>وەتسئەپ (WhatsApp)</strong>:<br>
              <strong style="color: #25D366; font-size: 14px;">9647501234567</strong>
            </div>
          </div>
          
          <div class="guide-step" style="cursor: pointer; background: rgba(82, 136, 193, 0.04); border-color: rgba(82, 136, 193, 0.1);" onclick="window.open('https://t.me/kurd24_job')">
            <div class="step-icon" style="background: rgba(82, 136, 193, 0.15); color: #5288c1;">
              <i data-lucide="send" style="width: 14px; height: 14px;"></i>
            </div>
            <div class="step-text">
              پەیوەندی لە ڕێگەی <strong>تێلیگرام (Telegram)</strong>:<br>
              <strong style="color: #5288c1; font-size: 14px;">@kurd24_job</strong>
            </div>
          </div>

          <div class="guide-step" style="background: rgba(255, 184, 0, 0.04); border-color: rgba(255, 184, 0, 0.1);">
            <div class="step-icon" style="background: rgba(255, 184, 0, 0.15); color: var(--accent);">
              <i data-lucide="star" style="width: 14px; height: 14px;"></i>
            </div>
            <div class="step-text">
              <strong>سەرنج:</strong> ڕیکلامی VIP ئەنیمەیشنی درەوشاوەی زێڕین لەخۆدەگرێت لەسەر لێوارەکانی لەناو ئەپدا و بۆ ماوەی دیاریکراو لە لوتکەی لیستەکەدا جێگیر دەکرێت.
            </div>
          </div>
        </div>
      </div>

    </div>
    
    <div class="footer">
      Kurd24 Job Platform © 2026 | <a href="/privacy.html" style="color:var(--text-secondary); text-decoration:underline; margin-right: 5px;">سیاسەتی پاراستنی نهێنی (Privacy Policy)</a>
    </div>
  </div>

  <script>
    // Supabase Credentials
    const SUPABASE_URL = "https://ojhminrrkkxwyybpgvrs.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_c0y0Fx3rb1O1kIXGTgcskg_SZeezhmX";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Initialize Lucide Icons
    lucide.createIcons();

    let downloadType = 'apk';
    let googlePlayUrl = '';
    let apkUrl = '/assets/kurd24-job.apk';

    // Tab switcher
    function showSection(sectionId) {
      document.querySelectorAll('.landing-section-content').forEach(sec => sec.style.display = 'none');
      document.getElementById('section-' + sectionId).style.display = 'block';
      
      const ids = ['download', 'services', 'about'];
      ids.forEach(id => {
        const link = document.getElementById('nav-' + id);
        if (id === sectionId) {
          link.style.color = 'var(--primary)';
          link.style.background = 'var(--primary-glow)';
        } else {
          link.style.color = 'var(--text-secondary)';
          link.style.background = 'transparent';
        }
      });
      lucide.createIcons();
    }

    // Load Settings dynamically
    async function loadSettings() {
      let settings = {
        primaryColorLight: "#6366f1",
        primaryColorDark: "#818cf8",
        accentColorLight: "#ec4899",
        accentColorDark: "#f472b6",
        borderRadius: 16,
        downloadType: "apk",
        googlePlayUrl: "https://play.google.com/store/apps/details?id=com.kurd24.job",
        logoUrl: "/assets/images/logo.png",
        fontUrl: "",
        apkUrl: "/assets/kurd24-job.apk"
      };

      try {
        // Fetch from Supabase settings table
        const { data, error } = await supabaseClient
          .from("system_settings")
          .select("settings")
          .eq("id", "app-config")
          .maybeSingle();

        if (data && data.settings) {
          settings = { ...settings, ...data.settings };
        } else {
          // Fallback to local settings JSON
          const response = await fetch('/assets/settings.json?t=' + Date.now());
          if (response.ok) {
            const localSettings = await response.json();
            settings = { ...settings, ...localSettings };
          }
        }
      } catch (e) {
        console.error('Failed to load settings:', e);
      } finally {
        // Apply custom primary/accent styling
        const root = document.documentElement;
        if (settings.primaryColorDark) {
          root.style.setProperty('--primary', settings.primaryColorDark);
          root.style.setProperty('--primary-glow', hexToRgbaCSS(settings.primaryColorDark, 0.15));
        }
        if (settings.accentColorDark) {
          root.style.setProperty('--accent', settings.accentColorDark);
        }
        if (settings.borderRadius !== undefined) {
          root.style.setProperty('--border-radius', `${settings.borderRadius}px`);
        }

        // Apply Logo
        if (settings.logoUrl) {
          const logoUrlWithCacheBuster = settings.logoUrl + (settings.logoUrl.includes('?') ? '&' : '?') + 't=' + Date.now();
          const logoImg = document.querySelector('.logo-img');
          if (logoImg) logoImg.src = logoUrlWithCacheBuster;
          
          // Apple touch icon
          const appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
          if (appleIcon) appleIcon.href = logoUrlWithCacheBuster;
        }

        downloadType = settings.downloadType || 'apk';
        googlePlayUrl = settings.googlePlayUrl || '';
        apkUrl = settings.apkUrl || '/assets/kurd24-job.apk';

        updateUI();
      }
    }

    // Convert hex to RGBA css color helper
    function hexToRgbaCSS(hex, alpha) {
      let r = 0, g = 0, b = 0;
      if (hex.length === 4) {
        r = parseInt(hex[1] + hex[1], 16);
        g = parseInt(hex[2] + hex[2], 16);
        b = parseInt(hex[3] + hex[3], 16);
      } else if (hex.length === 7) {
        r = parseInt(hex.substring(1, 3), 16);
        g = parseInt(hex.substring(3, 5), 16);
        b = parseInt(hex.substring(5, 7), 16);
      }
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function updateUI() {
      const subtitle = document.getElementById('app-subtitle');
      const btnText = document.getElementById('btn-text');
      const btnIcon = document.getElementById('btn-icon');
      const stepsContainer = document.getElementById('steps-container');

      if (downloadType === 'link') {
        subtitle.textContent = 'ئەپی فەرمی Kurd24 Job لە ڕێگەی فرۆشگای فەرمی Google Play دابەزێنە بۆ مۆبایلەکەت.';
        btnText.textContent = 'دابەزاندن لە Google Play';
        btnIcon.setAttribute('data-lucide', 'play');
        
        stepsContainer.innerHTML = `
          <div class="guide-step">
            <div class="step-icon">١</div>
            <div class="step-text">
              کلیک لەسەر دوگمەی <strong>"دابەزاندن لە Google Play"</strong>ی سەرەوە بکە بۆ چوونە ناو لاپەڕەی فەرمی ئەپەکە.
            </div>
          </div>
          <div class="guide-step">
            <div class="step-icon">٢</div>
            <div class="step-text">
              لە فرۆشگای گۆگڵ پلێی، کلیک لەسەر دوگمەی <strong>Install (دامەزراندن)</strong> بکە بۆ دابەزاندنی ئەپەکە بە شێوەیەکی فەرمی.
            </div>
          </div>
        `;
      } else {
        subtitle.textContent = 'ئەپی فەرمی Kurd24 Job بۆ سیستەمی ئەندرۆید دابەزێنە بە شێوازی APK بە شێوەیەکی ڕاستەوخۆ.';
        btnText.textContent = 'دابەزاندنی ئەپی Kurd24 Job (APK)';
        btnIcon.setAttribute('data-lucide', 'download-cloud');

        stepsContainer.innerHTML = `
          <div class="guide-step">
            <div class="step-icon">١</div>
            <div class="step-text">
              کلیک لەسەر دوگمەی درەوشاوەی <strong>"دابەزاندنی ئەپی Kurd24 Job (APK)"</strong>ی سەرەوە بکە بۆ دابەزاندنی ڕاستەوخۆی فایلەکە.
            </div>
          </div>
          <div class="guide-step">
            <div class="step-icon">٢</div>
            <div class="step-text">
              پاش دابەزاندنی فایلی APK، فایلەکە بکەرەوە و دایمەزرێنە (ڕێگە بدە بە دامەزراندن لە سەرچاوەی نەناسراو / Unknown Sources ئەگەر داواکرا).
            </div>
          </div>
        `;
      }
      lucide.createIcons();
    }

    // Set up button click handler
    document.getElementById('install-btn').addEventListener('click', () => {
      if (downloadType === 'link' && googlePlayUrl) {
        window.location.href = googlePlayUrl;
      } else {
        window.location.href = apkUrl;
      }
    });

    // Start configuration load
    loadSettings();
    
    // Set default nav active style
    document.getElementById('nav-download').style.background = 'var(--primary-glow)';
  </script>
</body>
</html>
